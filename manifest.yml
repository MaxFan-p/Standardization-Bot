display_information:
  name: Demo App
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Demo App
    always_online: true
  slash_commands:
    - command: /review-spec
      description: Privacy/compliance review of a spec
      usage_hint: "[paste spec text]"
      should_escape: false
    - command: /spec-log
      description: Show recently reviewed specs
      should_escape: false
    - command: /vendor-check
      description: Checks Vendor Privacy Info
      usage_hint: vendor
      should_escape: false
  agent_view:
    suggested_prompts: []
oauth_config:
  scopes:
    bot:
      - calls:read
      - app_mentions:read
      - assistant:write
      - calls:write
      - channels:history
      - commands
      - files:read
      - files:write
      - canvases:read
      - canvases:write
      - chat:write
      - chat:write.customize
      - im:history
      - im:read
      - im:write
  pkce_enabled: false
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  is_mcp_enabled: false
